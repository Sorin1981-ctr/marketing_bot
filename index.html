<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>ET Marketing Bot</title>

    <style>
        /* ---------------------------------------------------
           THEME VARIABLES
        --------------------------------------------------- */
        :root {
            --bg: #f7f7f7;
            --card: #ffffff;
            --text: #1a1a1a;
            --subtext: #666;
            --accent-gold: #c9a227;
            --accent-gold-hover: #b08c1f;
            --accent-emerald: #2ecc71;
            --accent-emerald-hover: #27ae60;
            --border: #e0e0e0;
            --sidebar-bg: #fafafa;
        }

        body.dark {
            --bg: #0d0d0d;
            --card: #1a1a1a;
            --text: #f2f2f2;
            --subtext: #aaa;
            --accent-gold: #d4af37;
            --accent-gold-hover: #b8952f;
            --accent-emerald: #2ecc71;
            --accent-emerald-hover: #27ae60;
            --border: #333;
            --sidebar-bg: #111;
        }

        /* ---------------------------------------------------
           GLOBAL
        --------------------------------------------------- */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            font-family: "Segoe UI", Arial, sans-serif;
            height: 100vh;
            display: flex;
            transition: 0.3s;
            color: var(--text);
        }

        /* ---------------------------------------------------
           SIDEBAR
        --------------------------------------------------- */
        .sidebar {
            width: 300px;
            background: var(--sidebar-bg);
            padding: 20px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .monogram {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: var(--accent-gold);
            font-size: 18px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--subtext);
            margin-bottom: 6px;
        }

        /* ---------------------------------------------------
           BOOK CARDS
        --------------------------------------------------- */
        .book-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .book-card {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--accent-gold);
            background: var(--card);
            cursor: pointer;
            transition: 0.2s;
        }

        .book-card:hover {
            border-color: var(--accent-emerald);
            box-shadow: 0 0 8px rgba(46, 204, 113, 0.4);
        }

        .book-card.selected {
            border-color: var(--accent-emerald);
            background: rgba(46, 204, 113, 0.1);
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
        }

        .book-title {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .book-author {
            font-size: 13px;
            color: var(--subtext);
        }

        /* ---------------------------------------------------
           BUTTONS
        --------------------------------------------------- */
        .menu-btn, .side-button {
            padding: 10px;
            background: var(--accent-gold);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
            width: 100%;
        }

        .menu-btn:hover, .side-button:hover {
            background: var(--accent-gold-hover);
        }

        /* ---------------------------------------------------
           MAIN CHAT AREA
        --------------------------------------------------- */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin: 16px;
            border-radius: 18px;
            background: var(--card);
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .header {
            padding: 16px 20px;
            background: var(--accent-gold);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bot-logo {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.1);
            font-size: 20px;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
        }

        .toggle {
            cursor: pointer;
            font-size: 20px;
        }

        /* ---------------------------------------------------
           MESSAGES
        --------------------------------------------------- */
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .msg {
            max-width: 80%;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 14px;
            font-size: 15px;
            animation: fadeIn 0.25s ease;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user {
            background: var(--accent-emerald);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .bot {
            background: var(--bg);
            color: var(--text);
            margin-right: auto;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            border: 1px solid var(--border);
        }

        .bot-avatar {
            width: 30px;
            height: 30px;
            background: var(--accent-gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
            flex-shrink: 0;
        }

        .typing {
            font-style: italic;
            color: var(--subtext);
            margin-bottom: 10px;
            font-size: 13px;
        }

        /* ---------------------------------------------------
           INPUT AREA
        --------------------------------------------------- */
        .input-area {
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--border);
            background: var(--card);
        }

        textarea {
            flex: 1;
            height: 50px;
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 10px;
            resize: none;
            font-size: 14px;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }

        .send-btn {
            padding: 0 20px;
            background: var(--accent-emerald);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }

        .send-btn:hover {
            background: var(--accent-emerald-hover);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo-area">
        <div class="monogram">ET</div>
        <div class="logo-text">ET Marketing Bot</div>
    </div>

    <div>
        <div class="section-title">Cărțile tale</div>
        <div id="bookList" class="book-list"></div>
    </div>

    <div>
        <div class="section-title">Acțiuni rapide</div>
        <button class="menu-btn" onclick="quick('Scrie o postare Facebook pentru cartea selectată, ton prietenos.')">
            Postare Facebook
        </button>
        <button class="menu-btn" onclick="quick('Generează 3 texte pentru reclame Google Ads pentru cartea selectată.')">
            Google Ads
        </button>
        <button class="menu-btn" onclick="quick('Creează un email de lansare pentru cartea selectată.')">
            Email Lansare
        </button>
        <button class="menu-btn" onclick="quick('Creează o campanie lunară pentru cartea selectată.')">
            Campanie Lună
        </button>
    </div>

    <div>
        <div class="section-title">Conversație</div>
        <button class="side-button" onclick="exportConversation()">Exportă conversația</button>
        <button class="side-button" onclick="clearConversation()">Șterge conversația</button>
    </div>
</div>

<!-- MAIN CHAT -->
<div class="main">
    <div class="header">
        <div class="header-left">
            <div class="bot-logo">👽</div>
            <div>
                <div class="header-title">ET Marketing Bot</div>
            </div>
        </div>
        <div class="toggle" onclick="toggleTheme()">🌙</div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
        <textarea id="input" placeholder="Scrie mesajul..."></textarea>
        <button class="send-btn" onclick="sendMessage()">Trimite</button>
    </div>
</div>

<script>
    let selectedBookId = null;

    /* ---------------------------------------------------
       THEME
    --------------------------------------------------- */
    function toggleTheme() {
        document.body.classList.toggle("dark");
        localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    }

    function loadTheme() {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") document.body.classList.add("dark");
    }

    /* ---------------------------------------------------
       BOOK LIST
    --------------------------------------------------- */
    async function loadBooks() {
        try {
            const res = await fetch("/books");
            const books = await res.json();
            const list = document.getElementById("bookList");
            list.innerHTML = "";

            books.forEach(book => {
                const card = document.createElement("div");
                card.className = "book-card";
                card.innerHTML = `
                    <div class="book-title">${book.title}</div>
                    <div class="book-author">${book.author}</div>
                `;
                card.onclick = () => selectBook(book.id, card);
                list.appendChild(card);
            });
        } catch {
            console.error("Nu pot încărca cărțile.");
        }
    }

    function selectBook(id, card) {
        selectedBookId = id;
        document.querySelectorAll(".book-card").forEach(c => c.classList.remove("selected"));
        card.classList.add("selected");
    }

    /* ---------------------------------------------------
       CHAT
    --------------------------------------------------- */
    function addMessage(text, type) {
        const box = document.getElementById("messages");
        const div = document.createElement("div");
        div.className = "msg " + type;

        if (type === "bot") {
            div.innerHTML = `
                <div class="bot-avatar">👽</div>
                <div>${text}</div>
            `;
        } else {
            div.innerText = text;
        }

        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        saveConversation();
    }

    function showTyping() {
        const box = document.getElementById("messages");
        const div = document.createElement("div");
        div.id = "typing";
        div.className = "typing";
        div.innerText = "ET scrie…";
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function hideTyping() {
        const t = document.getElementById("typing");
        if (t) t.remove();
    }

    async function sendMessage() {
        const input = document.getElementById("input");
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, "user");
        input.value = "";

        showTyping();

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();
            hideTyping();
            addMessage(data.reply, "bot");
        } catch {
            hideTyping();
            addMessage("Eroare la comunicarea cu serverul.", "bot");
        }
    }

    function quick(text) {
        document.getElementById("input").value = text;
        sendMessage();
    }

    /* ---------------------------------------------------
       CONVERSATION STORAGE
    --------------------------------------------------- */
    function saveConversation() {
        localStorage.setItem("conversation", document.getElementById("messages").innerHTML);
    }

    function loadConversation() {
        const saved = localStorage.getItem("conversation");
        if (saved) {
            document.getElementById("messages").innerHTML = saved;
        } else {
            addMessage(
                "Salut! Eu sunt ET 👽, asistentul tău premium pentru marketingul cărților. Alege o carte din stânga sau scrie-mi direct în chat.",
                "bot"
            );
        }
    }

    function clearConversation() {
        localStorage.removeItem("conversation");
        document.getElementById("messages").innerHTML = "";
        addMessage("Conversația a fost resetată.", "bot");
    }

    function exportConversation() {
        const text = document.getElementById("messages").innerText;
        const blob = new Blob([text], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "conversatie_ET.txt";
        a.click();
        URL.revokeObjectURL(url);
    }

    /* ---------------------------------------------------
       INIT
    --------------------------------------------------- */
    window.onload = () => {
        loadTheme();
        loadBooks();
        loadConversation();
    };
</script>

</body>
</html>
