<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Marketing Bot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 40px;
            text-align: center;
        }
        #chat {
            width: 60%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        textarea {
            width: 90%;
            height: 80px;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            background: #0078ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #005fcc;
        }
    </style>
</head>
<body>

<h1>🤖 Marketing Bot</h1>
<p>Scrie un mesaj și botul îți răspunde!</p>

<div id="chat">
    <textarea id="input" placeholder="Scrie mesajul aici..."></textarea><br>
    <button onclick="sendMessage()">Trimite</button>
    <p id="response"></p>
</div>

<script>
async function sendMessage() {
    const text = document.getElementById("input").value;

    const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
    });

    const data = await response.json();
    document.getElementById("response").innerText = data.reply;
}
</script>

</body>
</html>
