<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Marketing Bot</title>

    <style>
        /* ------------------------------
           THEME VARIABLES
        ------------------------------ */
        :root {
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #1a1a1a;
            --subtext: #555;
            --accent: #0078ff;
            --accent-hover: #005fcc;
            --bubble-user: #0078ff;
            --bubble-bot: #e8ecf5;
            --sidebar: #ffffff;
        }

        body.dark {
            --bg: #0f1116;
            --card: #1a1d24;
            --text: #e6e6e6;
            --subtext: #aaa;
            --accent: #4c8dff;
            --accent-hover: #2f6fe0;
            --bubble-user: #4c8dff;
            --bubble-bot: #2a2f3a;
            --sidebar: #16191f;
        }

        /* ------------------------------
           GLOBAL
        ------------------------------ */
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            font-family: "Segoe UI", Arial, sans-serif;
            height: 100vh;
            display: flex;
            transition: 0.3s;
        }

        /* ------------------------------
           SIDEBAR
        ------------------------------ */
        .sidebar {
            width: 220px;
            background: var(--sidebar);
            padding: 20px;
            box-shadow: 4px 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar h2 {
            margin: 0 0 10px 0;
            color: var(--text);
        }

        .menu-btn {
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 15px;
        }

        .menu-btn:hover {
            background: var(--accent-hover);
        }

        /* ------------------------------
           CHAT CONTAINER
        ------------------------------ */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--card);
            margin: 20px;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .header {
            padding: 20px;
            background: var(--accent);
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle {
            cursor: pointer;
            font-size: 20px;
        }

        /* ------------------------------
           MESSAGES
        ------------------------------ */
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .msg {
            max-width: 80%;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 14px;
            font-size: 15px;
            animation: fadeIn 0.3s ease;
            line-height: 1.4;
        }

        .user {
            background: var(--bubble-user);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .bot {
            background: var(--bubble-bot);
            color: var(--text);
            margin-right: auto;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .bot-avatar {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ------------------------------
           INPUT AREA
        ------------------------------ */
        .input-area {
            padding: 15px;
            display: flex;
            gap: 10px;
            background: var(--card);
        }

        textarea {
            flex: 1;
            height: 50px;
            border-radius: 12px;
            border: 1px solid #ccc;
            padding: 10px;
            resize: none;
            font-size: 15px;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }

        button {
            padding: 0 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        /* ------------------------------
           TYPING INDICATOR
        ------------------------------ */
        .typing {
            font-style: italic;
            color: var(--subtext);
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Funcții rapide</h2>

    <button class="menu-btn" onclick="quick('Scrie un text pentru Facebook despre cartea mea.')">
        Facebook Post
    </button>

    <button class="menu-btn" onclick="quick('Generează texte pentru reclame Google Ads.')">
        Google Ads
    </button>

    <button class="menu-btn" onclick="quick('Creează un email de lansare pentru cartea mea.')">
        Email Lansare
    </button>

    <button class="menu-btn" onclick="quick('Creează o campanie lunară pentru promovarea cărții.')">
        Campanie Lunară
    </button>
</div>

<!-- CHAT -->
<div class="chat-container">
    <div class="header">
        🤖 Marketing Bot
        <div class="toggle" onclick="toggleTheme()">🌙</div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
        <textarea id="input" placeholder="Scrie mesajul..."></textarea>
        <button onclick="sendMessage()">Trimite</button>
    </div>
</div>

<script>
function toggleTheme() {
    document.body.classList.toggle("dark");
}

function quick(text) {
    document.getElementById("input").value = text;
    sendMessage();
}

async function sendMessage() {
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    showTyping();

    const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
    });

    hideTyping();

    const data = await response.json();
    addMessage(data.reply, "bot");
}

function addMessage(text, type) {
    const box = document.getElementById("messages");

    const div = document.createElement("div");
    div.className = "msg " + type;

    if (type === "bot") {
        div.innerHTML = `
            <div class="bot-avatar">🤖</div>
            <div>${text}</div>
        `;
    } else {
        div.innerText = text;
    }

    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

function showTyping() {
    const box = document.getElementById("messages");
    const div = document.createElement("div");
    div.id = "typing";
    div.className = "typing";
    div.innerText = "Botul scrie…";
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

function hideTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
}
</script>

</body>
</html>
