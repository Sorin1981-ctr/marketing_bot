<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Marketing Bot</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f5f7fa;
            font-family: "Segoe UI", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 420px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
            color: #1a1a1a;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            resize: none;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        textarea:focus {
            border-color: #0078ff;
            box-shadow: 0 0 5px rgba(0,120,255,0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0078ff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }

        button:hover {
            background: #005fcc;
        }

        .response-box {
            margin-top: 20px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 10px;
            text-align: left;
            color: #333;
            font-size: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 Marketing Bot</h1>
    <p>Scrie un mesaj și botul îți răspunde instant.</p>

    <textarea id="input" placeholder="Scrie mesajul aici..."></textarea>
    <button onclick="sendMessage()">Trimite</button>

    <div id="response" class="response-box"></div>
</div>

<script>
async function sendMessage() {
    const text = document.getElementById("input").value;

    const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
    });

    const data = await response.json();

    const box = document.getElementById("response");
    box.style.display = "block";
    box.innerText = data.reply;
}
</script>

</body>
</html>
